services:
  - type: web
    name: lifereminder
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: LifeReminder
      - key: WHATSAPP_MODE
        value: live
